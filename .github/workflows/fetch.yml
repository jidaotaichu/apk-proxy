name: fetch-apks
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch script
        run: python3 fetch_apks.py || true

      - name: Upload release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la apks/ || true
          if ls apks/*.apk >/dev/null 2>&1; then
            TAG="apks-$(date +%Y%m%d-%H%M%S)"
            gh release create "$TAG" apks/*.apk \
              --repo "${{ github.repository }}" \
              --title "APKs $TAG" \
              --notes "binance/okx official apk" || true
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          else
            echo "no apk files"
          fi
