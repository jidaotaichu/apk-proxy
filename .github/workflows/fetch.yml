name: fetch-apks
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch script
        run: python3 fetch_apks.py

      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la apks/
          TAG="apks-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" apks/*.apk \
            --repo "${{ github.repository }}" \
            --title "APKs $TAG" \
            --notes "binance/okx official apk fetched by runner" || true
          echo "TAG=$TAG" >> "$GITHUB_ENV"
