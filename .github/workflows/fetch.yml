name: fetch-apks
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install playwright
        run: |
          pip install playwright -q
          python -m playwright install chromium --with-deps
          sudo apt-get install -y -qq xvfb >/dev/null 2>&1 || true

      - name: Run fetch script
        run: xvfb-run -a python3 fetch_apks.py

      - name: Upload release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -la apks/
          if ls apks/*.apk >/dev/null 2>&1; then
            TAG="apks-$(date +%Y%m%d-%H%M%S)"
            gh release create "$TAG" apks/*.apk \
              --repo "${{ github.repository }}" \
              --title "APKs $TAG" \
              --notes "binance/okx official apk" || true
            echo "TAG=$TAG" >> "$GITHUB_ENV"
          else
            echo "no apk files"
            exit 1
          fi
